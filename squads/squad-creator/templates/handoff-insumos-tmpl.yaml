# Template de Handoff — INSUMOS_READY
# Formato que @oalanicolas usa para entregar insumos extraídos para @pedro-valerio.
# Fonte: squads/squad-creator-pro/data/hybridops-patterns.md (seção "Template de Handoff (Já Existe)")
# Criado via Spec Pipeline do Solucionador — story SOLUCIONADOR, subtask 1.1 (E107)

handoff_type: INSUMOS_READY
from: "@oalanicolas"
to: "@pedro-valerio"

insumos:
  voice_dna:
    signature_phrases: [] # Mínimo 5
    source_verified: false # OBRIGATÓRIO: true
  thinking_dna:
    frameworks: []
    heuristics: []
  quotes:
    verified_count: 0 # Mínimo 15

validation_gates:
  - all_sources_have_SOURCE_tag: true
  - min_quotes: 15
  - min_signature_phrases: 5

# Se os insumos não passarem nos validation_gates acima, @pedro-valerio devolve
# para @oalanicolas usando o formato veto_handoff abaixo (mesma fonte).
veto_handoff:
  trigger: "insumos_incomplete"
  conditions:
    - "< 15 citações verificáveis"
    - "< 5 signature phrases"
    - "Conceitos sem [SOURCE:]"
    - "Inferências não marcadas"
  action: "DEVOLVER para @oalanicolas com lista específica"
